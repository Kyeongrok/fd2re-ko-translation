name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      BEPINEX_VERSION: 5.4.23.4
      XUNITY_VERSION: 5.4.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild _AutoGeneratedTranslations.txt from phase sources
        run: python source/build_xunity.py

      - name: Download BepInEx ${{ env.BEPINEX_VERSION }} (x64)
        run: |
          mkdir -p stage/game
          curl -sSL -o bepinex.zip \
            "https://github.com/BepInEx/BepInEx/releases/download/v${BEPINEX_VERSION}/BepInEx_win_x64_${BEPINEX_VERSION}.zip"
          unzip -q bepinex.zip -d stage/game

      - name: Download XUnity.AutoTranslator ${{ env.XUNITY_VERSION }} (BepInEx 5)
        run: |
          curl -sSL -o xunity.zip \
            "https://github.com/bbepis/XUnity.AutoTranslator/releases/download/v${XUNITY_VERSION}/XUnity.AutoTranslator-BepInEx-${XUNITY_VERSION}.zip"
          unzip -q xunity.zip -d stage/game

      - name: Build full release zip (BepInEx + XUnity + translations)
        run: python tools/build_release_full.py --game stage/game --out fd2re-ko-translation-full.zip

      - name: Build translation-only zip
        run: |
          mkdir -p stage/lite/BepInEx/Translation/ko/Text
          mkdir -p stage/lite/BepInEx/config
          cp BepInEx/Translation/ko/Text/_AutoGeneratedTranslations.txt \
             stage/lite/BepInEx/Translation/ko/Text/_AutoGeneratedTranslations.txt
          cp BepInEx/config/AutoTranslatorConfig.ini \
             stage/lite/BepInEx/config/AutoTranslatorConfig.ini
          cp release_assets/READ-ME-한국어.txt stage/lite/ 2>/dev/null || true
          cd stage/lite && zip -9 -r ../../fd2re-ko-translation.zip .

      - name: Show artifact info
        run: ls -lh fd2re-ko-translation*.zip

      - name: Upload artifacts (for workflow_dispatch runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: fd2re-ko-translation-${{ github.sha }}
          path: fd2re-ko-translation*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fd2re-ko-translation-full.zip
            fd2re-ko-translation.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
